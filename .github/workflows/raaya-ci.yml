name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tags: ["", "rego"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet -tags "${{ matrix.tags }}" ./...
      - run: go test -race -tags "${{ matrix.tags }}" ./...
      - run: go build -tags "${{ matrix.tags }}" ./cmd/raaya

  # Static scan only: --live would execute commands from the PR's configs.
  capability-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o "$RUNNER_TEMP/raaya" ./cmd/raaya
      - run: |
          "$RUNNER_TEMP/raaya" diff "${{ github.event.pull_request.base.sha }}" \
            --format markdown --output diff.md || status=$?
          cat diff.md >> "$GITHUB_STEP_SUMMARY"
          exit "${status:-0}"
